name: LookaheadRemote
options:
  bundleIdPrefix: com.lookahead
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  LookaheadRemote:
    type: application
    platform: iOS
    sources:
      - path: LookaheadRemote
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lookahead.remote
        PRODUCT_NAME: LookaheadRemote
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
    info:
      path: LookaheadRemote/Info.plist
      properties:
        CFBundleDisplayName: CenterGuard
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Connect to your laptop's LookaHead bridge to trigger demonstration warnings, view the portable sensor and coordinate incident tasks on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme: {}
