# XcodeGen spec for the Lookahead iPhone companion.
#   brew install xcodegen
#   cd ios && xcodegen --spec Lookahead.yml   # writes Lookahead.xcodeproj (git-ignored)
# (ios/project.yml is the separate LookaheadRemote app.)
#   open Lookahead.xcodeproj  # pick your Team under Signing, choose your iPhone, Run
name: Lookahead
options:
  bundleIdPrefix: com.hackutd2026
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set in Xcode → Signing & Capabilities (a free Apple ID team works)
    CODE_SIGN_STYLE: Automatic
targets:
  Lookahead:
    type: application
    platform: iOS
    sources:
      - path: Lookahead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackutd2026.lookahead
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Lookahead/Info.plist
      properties:
        CFBundleDisplayName: Lookahead
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        # The app talks plain HTTP to the laptop on the same Wi-Fi (npm run dev:lan).
        NSLocalNetworkUsageDescription: Lookahead connects to the laptop running the operations dashboard on your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true   # development build only: LAN IP addresses over http
  LookaheadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LookaheadTests
    dependencies:
      - target: Lookahead
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lookahead:
    build:
      targets:
        Lookahead: all
        LookaheadTests: [test]
    test:
      targets: [LookaheadTests]
